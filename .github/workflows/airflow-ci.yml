name: Airflow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-airflow-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airflow_pipeline_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airflow_pipeline_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AIRFLOW_HOME: /tmp/airflow-ci

      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags

      PYTHONPATH: >-
        ${{ github.workspace }}:${{ github.workspace }}/dags

      AIRFLOW_CONN_AIRFLOW_PIPELINE_POSTGRES: >-
        postgresql://postgres:postgres@127.0.0.1:5432/airflow_pipeline_demo

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

      PROJECT_ROOT: ${{ github.workspace }}

      KAGGLE_DATASET_SLUG: yasserh/titanic-dataset
      SOURCE_CSV_NAME: Titanic-Dataset.csv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Verify PostgreSQL
        run: |
          pg_isready \
            -h 127.0.0.1 \
            -p 5432 \
            -U postgres \
            -d airflow_pipeline_demo

      - name: Prepare pipeline directories
        run: |
          mkdir -p \
            data/downloads \
            data/raw \
            data/processed \
            data/summary

      - name: Initialize Airflow metadata database
        run: |
          rm -rf "$AIRFLOW_HOME"
          airflow db migrate

      - name: Confirm DAG and tasks
        run: |
          airflow dags list 

      - name: Test Kaggle authentication
        run: |
          kaggle datasets files \
            yasserh/titanic-dataset

      - name: Run complete Airflow DAG
        run: |
          airflow dags test \
            titanic_data_pipeline \
            2026-08-06

      - name: Verify generated files
        run: |
          find data -maxdepth 2 -type f -print

          test -f data/raw/Titanic-Dataset.csv
          test -f data/processed/titanic_processed.csv
          test -f data/summary/dataset_summary.json

      - name: Verify PostgreSQL tables
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h 127.0.0.1 \
            -p 5432 \
            -U postgres \
            -d airflow_pipeline_demo \
            -c "\dt airflow_pipeline_demo.*"

      - name: Verify loaded passenger records
        env:
          PGPASSWORD: postgres
        run: |
          ROW_COUNT=$(psql \
            -h 127.0.0.1 \
            -p 5432 \
            -U postgres \
            -d airflow_pipeline_demo \
            -tAc "
              SELECT COUNT(*)
              FROM airflow_pipeline_demo.titanic_passengers;
            ")

          echo "Passenger rows loaded: $ROW_COUNT"

          if [ "$ROW_COUNT" -le 0 ]; then
            echo "No passenger records were loaded"
            exit 1
          fi

      - name: Verify summary record
        env:
          PGPASSWORD: postgres
        run: |
          SUMMARY_COUNT=$(psql \
            -h 127.0.0.1 \
            -p 5432 \
            -U postgres \
            -d airflow_pipeline_demo \
            -tAc "
              SELECT COUNT(*)
              FROM airflow_pipeline_demo.dataset_summary;
            ")

          echo "Summary records loaded: $SUMMARY_COUNT"

          if [ "$SUMMARY_COUNT" -le 0 ]; then
            echo "No summary record was loaded"
            exit 1
          fi

      - name: Upload pipeline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airflow-pipeline-output
          path: |
            data/processed/
            data/summary/
          if-no-files-found: warn