name: Airflow CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-dag-check:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests first
        run: |
          python -m pytest tests/test_pipeline_scripts.py -q

      - name: Test Airflow DAG import
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import importlib.util
          import os

          dag_path = os.path.join(
              os.getcwd(),
              "dags",
              "airflow_pipeline_dag.py"
          )

          spec = importlib.util.spec_from_file_location(
              "airflow_pipeline_dag",
              dag_path
          )

          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          print("Airflow DAG file imported successfully")
          PY
